name: vocal_remover

services:
  redis:
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - vocal-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: backend/.env
        required: false
    environment:
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      NUMBA_CACHE_DIR: /tmp/numba_cache
      # Phase 1 Optimizations
      RETENTION_HOURS: "1"
      CLEANUP_INTERVAL_MINUTES: "15"
      MODEL_IDLE_TIMEOUT_SECONDS: "3600"
      MP3_BITRATE: "128k"
      DEMUCS_OVERLAP: "0.25"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/outputs:/app/backend/outputs
      - ./backend/cookies:/app/backend/cookies:ro
      # Each user has a different browser/profile path on their own
      # machine, so this is set per-deployment via YOUTUBE_BROWSER_PROFILE_HOST_PATH
      # in vocal-separator/.env (compose-level, not backend/.env). Falls
      # back to an empty local placeholder dir when unset, so this mount
      # never breaks a setup that doesn't use it.
      - ${YOUTUBE_BROWSER_PROFILE_HOST_PATH:-./backend/browser_profile}:/app/backend/browser_profile:ro
    networks:
      - vocal-net

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: celery -A backend.tasks worker --loglevel=info --concurrency=1 --beat --schedule=/tmp/celerybeat-schedule
    # Hard ceiling so separation cannot saturate every core and overheat the host.
    cpus: 6.0
    env_file:
      - path: backend/.env
        required: false
    environment:
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      NUMBA_CACHE_DIR: /tmp/numba_cache
      # Phase 1 Optimizations
      RETENTION_HOURS: "1"
      CLEANUP_INTERVAL_MINUTES: "15"
      MODEL_IDLE_TIMEOUT_SECONDS: "3600"
      MP3_BITRATE: "128k"
      DEMUCS_OVERLAP: "0.25"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/outputs:/app/backend/outputs
      - ./backend/cookies:/app/backend/cookies:ro
      - ${YOUTUBE_BROWSER_PROFILE_HOST_PATH:-./backend/browser_profile}:/app/backend/browser_profile:ro
    networks:
      - vocal-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - vocal-net

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SWAGGER_JSON: /spec/swagger.yaml
    volumes:
      # Directory bind mount (of a small dedicated folder containing only a
      # symlink to ../../swagger.yaml), not a single-file bind mount: on
      # Docker Desktop for Mac, a single-file bind mount loses track of the
      # file the moment an editor replaces it via atomic write+rename (very
      # common), leaving nginx serving 404s until the container is
      # recreated. A directory mount survives that. Mounting this narrow
      # folder - rather than the whole project - keeps outputs/ and other
      # project files out of this locally-exposed port.
      - ./swagger-spec:/spec:ro
    networks:
      - vocal-net

volumes:
  redis_data:

networks:
  vocal-net:
    driver: bridge
